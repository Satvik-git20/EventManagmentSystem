[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "event-management-system"
version = "1.0.0"
description = "Event Management System API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<7.0",
    "djangorestframework>=3.14,<4.0",
    "drf-spectacular>=0.27,<1.0",
    "django-filter>=23.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
    "pytest-cov>=4.1,<5.0",
    "gunicorn>=21.0,<22.0",
    "psycopg2-binary>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "ruff>=0.16,<1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Ignore RUF012 for Django class attributes (Meta classes, permission_classes, etc.)
ignore = ["RUF012"]
select = ["E", "F", "I", "N", "UP", "W", "C4", "B", "SIM", "T10", "T20", "PTH", "ERA", "RUF"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["RUF012", "I001", "E501"]
"*/tests.py" = ["B017", "S101", "E501"]

[tool.ruff.format]
quote-style = "single"